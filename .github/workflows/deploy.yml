name: Deploy FreelancerHub Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar Cloudflared para el túnel
        run: |
          curl -L -o cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Ejecutar script en Fedora por SSH
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USERNAME }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/github_key
          chmod 600 ~/.ssh/github_key
          
          cat << SSH_EOF > ~/.ssh/config
          Host servidor_secreto
            HostName $HOST
            User $USER
            ProxyCommand cloudflared access ssh --hostname %h
            StrictHostKeyChecking no
          SSH_EOF
          
          ssh -i ~/.ssh/github_key servidor_secreto "cd ~/freelancer_hub_backend && ./deploy.sh"
